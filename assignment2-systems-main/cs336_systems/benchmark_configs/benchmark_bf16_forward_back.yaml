experiment:
  seed: 42

models:
  small:
    d_model: 768
    d_ff: 3072
    num_layers: 12
    num_heads: 12

  medium:
    d_model: 1024
    d_ff: 4096
    num_layers: 24
    num_heads: 16

  large:
    d_model: 1280
    d_ff: 5120
    num_layers: 36
    num_heads: 20

  xl:
    d_model: 2560
    d_ff: 10240
    num_layers: 32
    num_heads: 32

  10B:
    d_model: 4608
    d_ff: 12288
    num_layers: 50
    num_heads: 36

shared_model:
  vocab_size: 10000
  max_seq_len: 512
  theta: 10000

benchmark:
  batch_size: 4
  sequence_length: 512
  warmup_values: [5]
  measurement_steps: 10
  precision: bf16
  max_grad_norm: null
  modes:
    - forward
    - forward_backward
  
runtime:
  device: cuda:7

output:
  csv_path: results/benchmark_bf16_forward_back.csv