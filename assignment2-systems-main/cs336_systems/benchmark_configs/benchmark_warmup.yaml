experiment:
  seed: 42

models:

  large:
    d_model: 1280
    d_ff: 5120
    num_layers: 36
    num_heads: 20


shared_model:
  vocab_size: 10000
  max_seq_len: 512
  theta: 10000

benchmark:
  batch_size: 4
  sequence_length: 512
  warmup_values: [0, 1, 2, 5]
  measurement_steps: 10
  modes:
    - forward
    - forward_backward
    - train_step

runtime:
  device: cuda:6

output:
  csv_path: results/benchmark_warmup.csv