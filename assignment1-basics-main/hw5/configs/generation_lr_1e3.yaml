model:
  d_model: 512
  num_layers: 4
  d_ff: 1344
  theta: 10000
  num_heads: 16
  max_seq_len: 256    # RoPE位置编码预计算cos sin表
  vocab_size: 10000


runtime:
  device: cuda:6

generation:
  checkpoint_path: checkpoints/tinystories_lr_1e3/step_10000.pt
  prompt: "Once upon a time"
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9

tokenizer:
  vocab_path: artifacts/tokenizers/tinystories_full_10k_v2/vocab_tinystories_full_bpe_10k_v2.pkl
  merges_path: artifacts/tokenizers/tinystories_full_10k_v2/merges_tinystories_full_bpe_10k_v2.pkl
  special_tokens:
    - "<|endoftext|>"